<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2441">
  <title>FAR System | Dashboard</title>
  <link rel="icon" type="image/png" href="https://www.tesda.gov.ph/Content/images/logos/TESDA%20Logo%20official.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7fb; color: #14243a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(100%, 470px); padding: 36px 28px; text-align: center; border: 1px solid #dce6f2; border-radius: 18px; background: #fff; box-shadow: 0 12px 32px rgba(12, 36, 65, .09); }
    h1 { margin: 0 0 12px; font-size: 23px; }
    p { line-height: 1.6; color: #56657a; }
    a { display: inline-block; margin-top: 12px; background: #123e70; border-radius: 10px; padding: 13px 20px; color: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #f6b800; outline-offset: 3px; }
    .spinner { width: 36px; height: 36px; margin: 0 auto 20px; border: 3px solid #dce6f2; border-top-color: #135a9f; border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>TESDA Region VII FAR System</h1>
    <p>Opening your secure financial accountability dashboard…</p>
    <a id="openApp" href="https://script.google.com/macros/s/AKfycbyjUzcMmyecDlkvaf6S2ynQ8BoFi4iiQZ96BGSGpQdzoAn9AmDbFEASZW0QpMSxzhtE/exec">Open FAR System</a>
    <p><small>If you are not redirected automatically, select the button above.</small></p>
  </main>
  <script>
    // A top-level navigation avoids the iframe connection refusal.
    const APP_URL = 'https://script.google.com/macros/s/AKfycbyjUzcMmyecDlkvaf6S2ynQ8BoFi4iiQZ96BGSGpQdzoAn9AmDbFEASZW0QpMSxzhtE/exec';
    window.location.replace(APP_URL);
  </script>
</body>
</html>
