
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f5f7fb">

    <meta name="description"
          content="TESDA FAR System Dashboard">

    <title>FAR System | Dashboard</title>

    <link rel="icon"
          type="image/png"
          href="https://www.tesda.gov.ph/Content/images/logos/TESDA%20Logo%20official.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f5f7fb;
        }

        body {
            position: fixed;
            inset: 0;
        }

        .app-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #f5f7fb;
        }

        .fallback {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            font-family: Arial, sans-serif;
            color: #334155;
        }
    </style>
</head>

<body>

    <iframe
        class="app-frame"
        src="https://script.google.com/macros/s/AKfycby-c2RqzAhbbZJMihI0Tu4fa73HBO6TYSiCefnb_uQlQQicdT7KW3sA3if2_1TKJT-N/exec"
        title="FAR System Dashboard"
        allow="fullscreen"
        allowfullscreen
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <noscript>
        <div class="fallback" style="display:flex">
            JavaScript is required to use this application.
        </div>
    </noscript>

</body>
</html>
