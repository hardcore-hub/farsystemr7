<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAR System | Dashboard</title>
<meta name="robots" content="noindex">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#07172e,#164e86);color:#fff}
main{width:min(490px,100%);background:#fff;color:#14253e;padding:35px;border-radius:20px;text-align:center;box-shadow:0 18px 55px #0004}h1{font-size:25px;margin:14px 0 8px}p{line-height:1.6;color:#5f7086}.emblem{font-size:38px}.link{display:block;text-decoration:none;background:#174e8b;color:white;padding:14px 18px;border-radius:10px;font-weight:700;margin-top:22px}.link:hover{background:#103c6f}.hint{font-size:12px}
</style>
</head>
<body>
<main>
 <div class="emblem" aria-hidden="true">🛡️</div>
 <h1>TESDA Region VII FAR System</h1>
 <p>Open the secure Financial Accountability Reporting portal. The system runs through Google Apps Script to protect access to your connected Google Sheets.</p>
 <a id="openApp" class="link" href="#">Open FAR System</a>
 <p id="msg" class="hint">This opens the application in a full browser tab, not an embedded frame.</p>
</main>
<script>
// REPLACE with your deployed Apps Script Web App URL ending in /exec.
// Use Deploy > Manage deployments > Web app > Copy URL.
const FAR_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby-c2RqzAhbbZJMihI0Tu4fa73HBO6TYSiCefnb_uQlQQicdT7KW3sA3if2_1TKJT-N/exec';
const target = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:[?#].*)?$/.test(FAR_WEB_APP_URL) ? FAR_WEB_APP_URL : '';
const link = document.getElementById('openApp');
if (target) {
  link.href = target;
  document.getElementById('msg').textContent = 'If the portal does not open automatically, select Open FAR System.';
  // Top-level navigation prevents iframe frame-policy errors.
  window.location.replace(target);
} else {
  link.removeAttribute('href');
  link.style.opacity = '.5';
  document.getElementById('msg').textContent = 'Setup required: paste your Apps Script /exec deployment URL into FAR_WEB_APP_URL before publishing on GitHub Pages.';
}
</script>
</body>
</html>
